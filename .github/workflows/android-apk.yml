name: Build Android APKs

# Builds installable debug APKs for the SprintGo customer AND courier apps on
# every push that touches them, and on manual dispatch. Each app's APK is a
# separate downloadable artifact on the run.
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/courier/**'
      - 'packages/shared/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      apiBase:
        description: 'API base URL to bake into this APK (overrides the API_BASE_URL variable). e.g. http://192.168.1.5:4000/api/v1'
        required: false
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # google-services.json is per Android app (it names the package), so each
        # app reads its own secret rather than sharing one
        include:
          - app: customer
            firebaseSecret: GOOGLE_SERVICES_JSON_CUSTOMER
          - app: courier
            firebaseSecret: GOOGLE_SERVICES_JSON_COURIER
    env:
      # prisma generate (api postinstall) reads this but never connects during a build
      DATABASE_URL: postgresql://user:pass@localhost:5432/sprintgo
      # Where the packaged app looks for the API. A manual run can override the
      # repository variable — handy for pointing an APK at a machine on the LAN.
      # capacitor.config.ts reads it too, so it must be set for every step below.
      VITE_API_BASE: ${{ inputs.apiBase || vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json — one source of truth
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contract
        run: pnpm --filter @sprintgo/shared build

      # A wrong or missing URL is invisible until the app fails on the phone —
      # print it so the run itself says which backend this APK will talk to.
      - name: Show which API this APK will talk to
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::warning::No API URL set — this APK has nothing to call. Set the API_BASE_URL variable, or pass one when running the workflow manually."
          else
            echo "This APK will call: $VITE_API_BASE"
          fi

      - name: Build ${{ matrix.app }} web bundle
        run: pnpm --filter @sprintgo/${{ matrix.app }} build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        working-directory: apps/${{ matrix.app }}
        run: npx cap add android

      # Firebase (push) is applied to the freshly generated project. Without the
      # secret this is a no-op and the APK simply ships without push.
      - name: Wire Firebase for push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[matrix.firebaseSecret] }}
        run: node scripts/android-firebase.mjs apps/${{ matrix.app }}

      - name: Sync web assets into Android
        working-directory: apps/${{ matrix.app }}
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprintgo-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
