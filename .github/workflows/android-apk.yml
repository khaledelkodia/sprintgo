name: Build Android APKs

# Builds installable debug APKs for the SprintGo customer AND courier apps on
# every push that touches them, and on manual dispatch. Each app's APK is a
# separate downloadable artifact on the run.
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/courier/**'
      - 'packages/shared/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # google-services.json is per Android app (it names the package), so each
        # app reads its own secret rather than sharing one
        include:
          - app: customer
            firebaseSecret: GOOGLE_SERVICES_JSON_CUSTOMER
          - app: courier
            firebaseSecret: GOOGLE_SERVICES_JSON_COURIER
    # prisma generate (api postinstall) reads this but never connects during a build
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/sprintgo
    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json — one source of truth
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contract
        run: pnpm --filter @sprintgo/shared build

      # Where the packaged app looks for the API. Set the repository variable
      # API_BASE_URL (Settings → Secrets and variables → Actions → Variables) to
      # something like https://api.example.com/api/v1 once the API is hosted;
      # without it the APK has nowhere to call.
      - name: Build ${{ matrix.app }} web bundle
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
        run: pnpm --filter @sprintgo/${{ matrix.app }} build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        working-directory: apps/${{ matrix.app }}
        run: npx cap add android

      # Firebase (push) is applied to the freshly generated project. Without the
      # secret this is a no-op and the APK simply ships without push.
      - name: Wire Firebase for push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[matrix.firebaseSecret] }}
        run: node scripts/android-firebase.mjs apps/${{ matrix.app }}

      - name: Sync web assets into Android
        working-directory: apps/${{ matrix.app }}
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprintgo-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
